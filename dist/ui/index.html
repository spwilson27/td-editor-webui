// the mean colour with alpha = mean alpha * anti-aliased coverage.  Bright areas therefore thin out (ink-on-paper look).
//   uP0 = (cellSize, cos(angle), sin(angle), shape 0 dot / 1 line)
void main() {
    ivec2 f = fxPos();
    vec2 p = vec2(fxDoc(f)) + 0.5;                         // document position of the pixel centre
    float cs = max(uP0.x, 1.0);
    vec2 cx = vec2(uP0.y, uP0.z);                          // image of the grid x axis (y down: clockwise on screen)
    vec2 cy = vec2(-uP0.z, uP0.y);
    vec2 u = vec2(dot(p, cx), dot(p, cy)) / cs;            // grid coordinates (cells)
    vec2 cell = floor(u);
    vec2 local = (u - cell - 0.5) * cs;                    // px from the cell centre in grid axes
    vec3 sum = vec3(0.0);
    float asum = 0.0;
    vec2 org = vec2(fxDoc(ivec2(0, 0)));
    for (int j = 0; j < 4; j++) {
        for (int i = 0; i < 4; i++) {

            vec2 dp = g.x * cx + g.y * cy;                                        // document position

            vec4 s = fxSrc(ivec2(int(fp.x), int(fp.y)));

            asum += s.a;

    vec3 col = clamp(sum / max(asum, 1e-6), 0.0, 1.0);        // mean straight colour (alpha weighted)

    fxOut(vec4(col * oa, oa));

// exact integer straight 8-bit colour of a premultiplied texel: k = round(c*255), m = round(a*255), straight = min((510 k + m) / (2 m), 255), 0 if m = 0
ivec3 fxStraight8(vec4 c) {

    if (m <= 0) return ivec3(0);
    ivec3 k = ivec3(floor(c.rgb * 255.0 + 0.5));

    for (int j = -n; j <= n; j++) {

            vec4 c = fxSrc(f + ivec2(i, j) * st);
            ivec3 s8 = fxStraight8(c);
            int l = (54 * s8.r + 183 * s8.g + 19 * s8.b + 128) >> 8;
            ivec2 ll = ivec2(l, l * l);
            if (i <= 0 && j <= 0) { sm[0] += c; sl[0] += ll; }
            if (i >= 0 && j <= 0) { sm[1] += c; sl[1] += ll; }
            if (i <= 0 && j >= 0) { sm[2] += c; sl[2] += ll; }
            if (i >= 0 && j >= 0) { sm[3] += c; sl[3] += ll; }

}

// 4-neighbour on the other side; outside the texture counts as transparent).  Each seed carries its signed distance
// \`off\` from its centre to the iso-0.5 contour estimated from its coverage (0.5 - alpha, so a hard edge gives +-0.5),
// which gives sub-pixel accurate anti-aliased stroke edges:
//     signed distance of a pixel p (positive outside)  sd = |p - s| + off_s   (outside p)   /   -(|p - s| - off_s)  (inside p)
// Pass ids: 0 = jump pass, 1 = composite.
//   jump pass:   uP0 = (step k px, first (1: seeds are derived from the effect input; 0: from the previous pass), 0, 0)
//                output (seed x, seed y, off, valid)  in fx coordinates, rgba32f.   Searches the 3x3 neighbourhood at +-k.
//   composite:   uP0 = (position 0 inside / 1 centre / 2 outside, width w px, 0, 0)    uP1 = colour (straight rgb, a = alpha * opacity)
//                The band is anti-aliased with clamp(0.5 - distance) at both edges and is composited OVER the content.
// Limits: width <= 128; JFA is approximate (rare off-by-a-pixel nearest seed); both hosts run the same code so they agree.
bool isEdge(ivec2 q) {
    bool inside = fxSrc(q).a >= 0.5;
